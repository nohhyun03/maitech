<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAITECH 로그인</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="login-page">
  <form class="login-card" id="loginForm">
    <div class="login-logo"><img src="images/logo.png" alt="MAITECH 로고"></div>
    <h1 class="login-title">MAITECH</h1>

    <div class="login-field login-field--id">
      <label for="loginId">ID</label>
      <input type="text" id="loginId" name="loginId" autocomplete="username">
    </div>

    <div class="login-field login-field--password">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" name="loginPassword" autocomplete="current-password">
    </div>

    <label class="login-remember">
      <input type="checkbox" id="rememberMe">
      Remember me
    </label>

    <a href="#" class="login-forgot">Forgot Password</a>

    <div class="login-error" id="loginError"></div>

    <button type="submit" class="login-submit">Login</button>
  </form>
</div>
<script src="js/login.js"></script>
</body>
</html>
