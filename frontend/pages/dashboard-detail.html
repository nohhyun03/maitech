<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공정 이상 상세 | MAITECH</title>
<link rel="stylesheet" href="../css/common.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/dashboard-detail.css">
</head>
<body></body>
<script src="../js/shell.js"></script>
<script src="../js/api.js"></script>
<script>
renderAppShell({
  active: 'detail',
  role: (getCurrentUser() || {}).role || 'worker',
  mainHtml: `
    <div class="breadcrumb">
      <a class="breadcrumb-back" href="javascript:history.back()">&larr; 페이지 되돌아가기</a>
    </div>
    <div class="page-title-row">
      <div>
        <div class="page-heading">공정 이상 상세</div>
        <div class="page-subheading">실시간 공정 상태 현황 &gt; 이상 알림 &gt; 상세 보기</div>
      </div>
      <a class="icon-badge" id="simulationLink" href="dashboard-simulation.html">
        <span>시뮬레이션 진행</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12H19M13 6L19 12L13 18" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>

    <div class="stat-grid stat-grid-5" id="summaryGrid">
      <div class="stat-card stat-card-compact"><span class="badge">심각도</span><div class="value" id="summarySeverity"></div></div>
      <div class="stat-card stat-card-compact"><span class="badge">공정명</span><div class="value" id="summaryProcess"></div></div>
      <div class="stat-card stat-card-compact"><span class="badge">감지 시점</span><div class="value" id="summaryDetectedAt"></div></div>
      <div class="stat-card stat-card-compact"><span class="badge">이상 지속 시간</span><div class="value" id="summaryDuration"></div></div>
      <div class="stat-card stat-card-compact"><span class="badge">현재 상태</span><div class="value" id="summaryStatus"></div></div>
    </div>

    <div class="section-title">
      실시간 공정 상태 현황
      <span class="updated-at" id="updatedAt">마지막 업데이트: 방금 전</span>
    </div>
    <div class="stat-grid" id="metricGrid"></div>

    <div class="section-title">
      AI 원인 분석
    </div>
    <div class="two-col">
      <div class="panel">
        <span class="panel-label">주요 영향 변수</span>
        <table class="data-table" id="causeTable">
          <thead>
            <tr><th>변수명</th><th>기여도</th><th>현재값</th><th>정상범위</th><th>경고 범위</th></tr>
          </thead>
          <tbody id="causeTableBody"></tbody>
        </table>
      </div>
      <div class="panel">
        <span class="panel-label">AI 예상 원인</span>
        <div id="causeList"></div>
      </div>
    </div>
  `,
});
</script>
<script src="../js/dashboard-detail.js"></script>
</html>
